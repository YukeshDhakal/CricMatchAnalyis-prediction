[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "third-umpire"
version = "0.1.0"
description = "Third Umpire: AI cricket analyst -- video engine + ingestion."
requires-python = ">=3.10"
dependencies = [
    # -- video engine --
    "opencv-python>=4.10,<6",
    "numpy>=1.26,<3",
    "ultralytics>=8.3,<9",
    # torch>=2.6 is a security floor, not just a version bump: it switched torch.load's
    # default to weights_only=True, which stops a malicious/corrupted .pt checkpoint from
    # executing arbitrary code via pickle on load. Don't downgrade below this.
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "supervision>=0.24,<1",
    # Real multi-object tracker (Kalman-filter ByteTrack) -- supervision.ByteTrack is
    # deprecated in favor of this package; see src/video_engine/tracking/bytetrack_tracker.py.
    "trackers>=2.6,<3",
    # -- ingestion --
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    # -- scoreboard_ocr (prototype) --
    # Needs the Tesseract OCR binary installed separately (not a pip package) --
    # e.g. `winget install --id UB-Mannheim.TesseractOCR` on Windows.
    "pytesseract==0.3.13",
    # -- rating (LLM coaching-note writer) --
    # Only used by rating.llm.OllamaClient to POST to a local Ollama server. Imported
    # lazily, and the suggestion engine falls back to its deterministic template
    # library whenever it's absent or the server is down -- so nothing breaks without
    # it, notes just read more bluntly.
    "requests==2.34.2",
    # -- player_reports / live test console --
    "streamlit==1.63.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# -- video pipeline HTTP API (src/api/) -- kept optional so installing the Streamlit
# console doesn't also pull in a web server stack it doesn't use.
api = ["fastapi==0.141.1", "uvicorn[standard]==0.52.3", "python-multipart==0.0.32"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # Tests that build a warehouse at the real thing's order of magnitude (thousands of
    # matches) rather than a handful. They run by default -- a scale regression here is a
    # 500x one, so it should not be opt-in -- but `-m "not slow"` skips them for a fast
    # inner loop. See tests/rating/test_pipeline_scale.py.
    "slow: builds a large synthetic warehouse; deselect with -m 'not slow'",
]
