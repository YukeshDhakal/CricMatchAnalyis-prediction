[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-engine"
version = "0.1.0"
description = "Computer-vision analysis engine for Third Umpire: per-delivery player/ball tracking, pose estimation, and event segmentation."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10,<6",
    "numpy>=1.26,<3",
    "ultralytics>=8.3,<9",
    # torch>=2.6 is a security floor, not just a version bump: it switched torch.load's
    # default to weights_only=True, which stops a malicious/corrupted .pt checkpoint from
    # executing arbitrary code via pickle on load. Don't downgrade below this.
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "supervision>=0.24,<1",
    # Real multi-object tracker (Kalman-filter ByteTrack) — supervision.ByteTrack is
    # deprecated in favor of this package; see tracking/bytetrack_tracker.py.
    "trackers>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
